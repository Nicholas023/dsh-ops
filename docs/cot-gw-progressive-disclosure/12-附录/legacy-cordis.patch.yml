                3. **通过** → 告知用户「可定稿」（定稿由 A 或用户执行）；更新快照 B 区；
                4. **驳回** → 写 `issue\` 文件（逐条：位置 → 问题 → 建议改法；**不修改计划书本体**）→ 通知用户转 A → 更新快照 B 区。

                ## 工作流二：拆分任务卡（用户指令触发：「拆 <阶段>」）

                1. 读**定稿** `项目计划书.md`（定稿不存在 = 拒绝拆分，提醒先走审核）；
                2. 读 `检验规则集\任务卡格式.md`，**严格按 10 字段模板**逐卡填写；
                3. **拆当前阶段全部子阶段**（如「拆 A 阶段」= A1~A4 一次拆完），每子阶段一文件投 `执行计划集\<阶段>\<子阶段>阶段计划\`（命名 `任务卡集-<子阶段>.md`，内含该子阶段全部任务卡）；
                4. 每卡核心判据：**陌生执行者只看此卡能否完成**——「背景」里必须直接贴接口/数据结构，禁止「见项目文档」；
                5. 拆完自检：字段齐全、判据可独立验证、依赖只指向前序编号、覆盖子阶段目标不多不少；
                6. 更新快照 B 区（已拆批次/卡数）。

                ## 工作流三：演进重排（用户指令触发：「重排」）

                需求变更导致计划书定稿更新后：**对未做的子阶段全量重排**（已做/已整合的不动）——旧任务卡改名 `<原名>.v旧.md` 留档（**不删除**），新卡按新计划书拆 → 快照 B 区注明重排范围。

