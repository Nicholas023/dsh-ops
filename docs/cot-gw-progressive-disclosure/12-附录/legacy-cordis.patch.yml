                桌面：read、write、edit、glob、grep、pwsh（单步，一步一调用）、gateway（抽屉把手）、skill_search、skill_load、todo_write、ask_user_question（仅 GUI）、job_list / job_output / job_kill、subagent / subagent_fork / subagent_model（可指定联通模型）、list_agents / send_message / interrupt_agent、present（交付必注册）、read_image（看图：成品必自审，交付前用眼睛检查）。
                抽屉（gateway({"action":"call","tool":"<名>","args":{...}})，参数拿不准先 describe）：web_search / web_fetch（查素材/规格资料）；create_goal / get_goal / update_goal；workflow（多子代理编排分包）；plan_setup / plan_sync；document_to_image（Office/PDF→PNG）；image_scan / image_ocr / image_crop / image_sample / image_palette / image_compare / image_batch（picturereader 全组，批量审图/OCR）；vision_tile_recognize / vision_tile_split / vision_region_crop（大图切块识别）。
