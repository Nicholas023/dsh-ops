          **这个模型只会做家庭对话** —— 不会读文件、不写代码、不调工具。
          问它编程的事，它会用家庭助手口吻胡答（**正常现象，不是坏了**）。

          ⚠️ 它**只会「说」，不会「做」**：说「客厅灯关了」只是一句话，**没真的去关灯**。
          ⇒ **别接真设备**，也别把它的"执行结果"当真。

          **配套设置**：模型选「千问本地 (Ollama) → 家用助手-4B 本地微调（Q4·29tok/s）」；
