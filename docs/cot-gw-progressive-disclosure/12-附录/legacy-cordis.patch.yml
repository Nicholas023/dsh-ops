        plugins:
          # The `dev-ops` agent preset — ① 开发与维护（v2 体系 7 大类之一）。
          #
          # 机制：gateway 抽屉。gateway / tool-gate / tool-watch / skill-search 为本目录
          # 自包含实现（skill-search v2：优先技能提示与检索别名由 config 注入，不硬编码）。
