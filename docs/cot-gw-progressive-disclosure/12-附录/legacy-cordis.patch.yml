                    codeNotMatches: 'tmp|temp|_crops'
                  maxPerSession: 2
                  say: 'writeFileSync 直写要当心：受管文件（名册 / 规则 / 计划 / 看板数据 / ledger-v3.json / workspace.json）必须走 edit 或 write 工具 —— 那条路带「读后写」观察约束与 GUI 卡片，手册也明确禁止手工编辑 ledger。新建临时文件与批量产物不受此限。'
