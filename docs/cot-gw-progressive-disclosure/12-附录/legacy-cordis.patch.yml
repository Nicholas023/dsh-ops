                - `99-项目库\` —— C 的整合成果库（只读参考，如已有可复用的资产）

                ## 首次开工：项目初始化（职责在你）

                1. 对照上述目录结构**自查**，缺的目录/占位文件**由你补建**（含 `03-项目执行\执行者文件\`、`计划书中转\{计划文件,issue}\`、各阶段占位符）；
