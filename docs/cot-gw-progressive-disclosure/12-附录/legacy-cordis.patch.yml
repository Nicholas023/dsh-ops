    - id: preset-home-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        name: 家庭助手试玩
        description: |
          **2026-09-20 建**。专门用来试**本项目自己微调的本地模型**（`ollama: home-assistant:latest`）。

          **为什么单独建一个**：DSH 的**工具定义本身就有上万 token**，加上 persona 实测输入 **19108 token**，
