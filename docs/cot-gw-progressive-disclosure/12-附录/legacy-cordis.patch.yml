                  skipIfToolUsed: present
                  maxPerSession: 2
                  say: '你在产出清单 / 报告 / 核查结论这类给用户看的文档，但本会话至今没有一次 present —— 用户拿不到可点开的链接（用户原话：「你要在 gui 中给我这种链接，不然我根本找不到在哪里」）。'
    - id: preset-cot-gw-arch
