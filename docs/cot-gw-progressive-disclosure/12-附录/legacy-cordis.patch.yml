              - id: workflow-worker-thread
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64


          - id: skill-search
            name: 'dsh-cot-gw-static/skill-search-legacy'


          - id: gateway
            name: 'dsh-cot-gw-static/gateway'


          - id: tool-gate
            name: 'dsh-cot-gw-static/tool-gate'
            config:
              # STATIC resident surface: these exact tools stay in every request's
              # tool catalog. Fixed schemas keep the request prefix byte-stable, so
