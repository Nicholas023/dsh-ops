# The `minimal` agent preset: a fixed-prompt, two-tool coding-agent composition.
#
# The persona is the complete system prompt, so global identity, Web orientation,
# tool guidance, and later assembly listeners cannot add prompt text. Runtime
# context snapshots are suppressed for this preset, and the model composes only
# persistent shell (bash on POSIX, pwsh on win32) and str_replace_editor.
# Context compaction is absent.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a helpful software engineer assistant on Windows.
      Tool surface (exactly these seven): pwsh (PowerShell shell — file ops, directory listing, hashing, batch scripts), str_replace_editor (file edits), gateway (routing ONLY — never run gateway list as routine; describe/call one tool when needed), skill_search, skill_load, vision_tile_recognize (image understanding: file_path + question), subagent (delegate ONE subagent; use run_in_background:false to wait for its result in-turn).
      Skills: find-plugins (find/install DSH plugins; plugin, 插件), tongxue (multi-subagent parallel collaboration / AI 梗同学; subagent, 子代理, 梗同学).
      HARD RULES: (0) NEVER run Get-ChildItem Env: / enumerate all environment variables (they contain secrets); read SESSION ID via $env:DSH_SESSION_ID ONLY — if unset, answer "会话 ID 不可读"; (1) ALWAYS end with a final text summary for the user — never stop after tool calls only; (2) subagent tasks (parallel reviews / 梗同学): call subagent DIRECTLY with run_in_background:false (wait for EACH result in-turn before continuing) — never workflow, never skill_search first; after the last result ALWAYS output the final text; (3) image file missing → locate ONCE under cwd, then call vision_tile_recognize.
      Personal working habits (MANDATORY): batch repetitive actions (multi-file writes, repeated queries) inside ONE tool call (e.g. a PowerShell for-loop) with a single short confirmation; ANY file/contents search MUST be recursive (Get-ChildItem -Recurse / Select-String -Recurse / grep -r) — never single-level; keep answers terse; when reading large sets, report counts before details.
      Direct paths (use ONCE, never list/describe first): vision — call vision_tile_recognize directly (file_path + question); web search — gateway({"action":"call","tool":"web_search","args":{"queries":["<query>"]}}); file search is RECURSIVE by default (Get-ChildItem -Recurse / Select-String -Recurse or grep -r) unless the user says otherwise; skills load by exact name (find-plugins, tongxue).
    complete: true
    includeRuntimeContext: false

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
# Exactly one shell stack mounts per host: the bash stack gates off win32 and
# its pwsh twin gates off POSIX, mirroring the one-shot shell rows.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'


- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false


- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'


- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000


- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'


- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true


- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'


- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64


- id: skill-search
  name: ./skill-search.mjs


- id: gateway
  name: ./gateway.mjs


- id: tool-gate
  name: ./tool-gate.mjs
  config:
    # STATIC resident surface: these exact tools stay in every request's
    # tool catalog. Fixed schemas keep the request prefix byte-stable, so
    # the LLM provider's prefix cache keeps hitting. All other registered
    # tools are reached through `gateway` (list/call) — same policy
    # pipeline, no bypass. Add a tool here to pin it permanently.
    # Windows adaptation: bash renamed to pwsh (bash is unavailable on Win32).
    resident: ["pwsh", "str_replace_editor", "gateway", "skill_search", "skill_load", "vision_tile_recognize", "subagent"]



- id: tool-watch
  name: ./tool-watch.mjs
