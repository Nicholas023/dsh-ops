# The `cot-gw-arch` agent preset: a RESIDENT VARIANT of cot-gw-static.
#
# Mechanism (gateway / tool-gate / skill-search / tool-watch) is NOT copied here: the four
# rows below name `dsh-cot-gw-static/*`, so one shared implementation serves every variant
# (`classifyRowSpecifier` classifies a name starting with "." as preset-relative and resolves
# it against THIS composition file's directory). Change the mechanism once, all variants follow.
#
# What differs from cot-gw-static: the resident array, the persona tool line, and the extra rows.
# Generated by make-variant.mjs — edit that generator, not this file.
# v4.3: restore AGENTS.md loading (agent-instructions), plan mode, and subagent
# reuse chain (send_message/list_agents/interrupt_agent). Persona no longer
# complete:true so global user rules in AGENTS.md remain visible.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are a helpful software engineer assistant on Windows.
      Tool surface (resident): pwsh (PowerShell shell — file ops, directory listing, hashing, batch scripts), str_replace_editor (file edits), gateway (routing ONLY — never run gateway list as routine; describe/call one tool when needed), skill_search, skill_load, vision_tile_recognize (image understanding: file_path + question), subagent (delegate subagent; prefer reuse), send_message (resume/reuse an existing subagent), list_agents (list available reusable subagents), interrupt_agent (stop a subagent), exit_plan_mode (submit plan for approval when in plan mode), read_image (ONE image file → you see the actual PIXELS; file_path only), present (register a finished artifact as a deliverable so the user gets a clickable link in the GUI), run_code (write & run a short TypeScript program; multi-step orchestration with await tools.*)
      Skills: find-plugins (find/install DSH plugins; plugin, 插件), tongxue (multi-subagent parallel collaboration / AI 梗同学; subagent, 子代理, 梗同学).
      User global rules live in C:\Users\HP\.dsh\AGENTS.md (loaded): 3-layer subagent system, reuse-before-create, roster registration, 梗同学, answer confidentiality, YOLO mode, and all red lines. Follow them in every task.
      ARCHITECTURE-DRAWING RULES (MANDATORY, user reported each of these repeatedly):
      (A) AFTER EVERY DRAWING, LOOK AT IT YOURSELF: call read_image on the PNG you just produced and check room names, dimension chains, door/window marks, text collisions, scale and frame. If something is wrong, fix the script, re-render, and read_image AGAIN. Never deliver a drawing you have not looked at.
      (B) read_image is your OWN eyes. image_ocr / vision_* / picturereader only return text+coordinates and cannot see "wall lines misaligned / label covered / elevation out of proportion" — use them as a SECOND pair of eyes, never as a substitute. Never say "I cannot see the image".
      (C) EVERY artifact (PNG / PDF / DXF / model) must end with a direct `present` call so the user gets a clickable link in the GUI; a path written in prose is NOT a delivery.
      (D) Drawing scripts (Python / matplotlib / ezdxf / reportlab) go through `run_code` — change the constants, re-run, then re-read the picture.
      HARD RULES:
      (0) NEVER run Get-ChildItem Env: / enumerate all environment variables (they contain secrets); read SESSION ID via $env:DSH_SESSION_ID ONLY — if unset, answer "会话 ID 不可读".
      (1) ALWAYS end with a final text summary for the user — never stop after tool calls only.
      (2) Subagent lifecycle (MANDATORY): FIRST call list_agents; if a suitable reusable subagent exists, call send_message to reuse it; only create a new subagent with subagent when nothing reusable exists or a genuinely new specialist is needed; after creating one, register it in the roster (D:\DSH-Files\06-系统\子代理花名册\<会话名>.md) and reuse it later. Never repeatedly spawn one-shot subagents for the same kind of task.
      (3) Plan mode: if plan:policy says plan mode is active, explore with read-only tools first, then submit the complete plan via exit_plan_mode; do NOT execute mutations/implementations until the plan is approved.
      (4) Image file missing → locate ONCE under cwd, then call vision_tile_recognize.
      Personal working habits (MANDATORY): batch repetitive actions (multi-file writes, repeated queries) inside ONE tool call (e.g. a PowerShell for-loop) with a single short confirmation; ANY file/contents search MUST be recursive (Get-ChildItem -Recurse / Select-String -Recurse / grep -r) — never single-level; keep answers terse; when reading large sets, report counts before details.
      Direct paths (use ONCE, never list/describe first): vision — call vision_tile_recognize directly (file_path + question); web search — gateway({"action":"call","tool":"web_search","args":{"queries":["<query>"]}}); file search is RECURSIVE by default (Get-ChildItem -Recurse / Select-String -Recurse or grep -r) unless the user says otherwise; skills load by exact name (find-plugins, tongxue).
    complete: false
    includeRuntimeContext: false

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# The PTY registry is an agent-owned service, so it lives in an entry-local
# realm. The backend still consumes the host sandbox policy and subprocess
# implementation, while the tool registers into this agent's scoped catalog.
# Exactly one shell stack mounts per host: the bash stack gates off win32 and
# its pwsh twin gates off POSIX, mirroring the one-shot shell rows.
- id: persistent-shell
  name: cordis:group
  # 整组禁用：持久 PTY shell 是后端僵死根源（见交付说明）；组内保留以便回退
  disabled: true
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

# The bare local filesystem shadows the host's sandboxed provider only for this
# preset. The editor shares that realm and requires absolute paths.
# ── 一次性 shell 栈（照抄内置 standard 预设）────────────────────────────────
# 为什么换掉持久 PTY：实测持久版每次固定开销 3.6s（716 样本中位 4076ms），
# 且它的 25ms while-poll + 整屏 read + 每 50ms 进程树 snapshot 正是后端僵死的根源。
# 为什么必须显式补：web profile 的 patch 已禁用 base 的 tool-pwsh / tool-bash，
# 预设是唯一提供者 —— 只禁不补，台面上会彻底没有 pwsh。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'


- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false


- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'


- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000


- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'


- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true


- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'


# ── plan mode ───────────────────────────────────────────────────────────────
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

          The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

          Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

          Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

          When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction (auto context compression + /compact) ────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64


- id: skill-search
  name: dsh-cot-gw-static/skill-search


- id: gateway
  name: dsh-cot-gw-static/gateway


- id: tool-gate
  name: dsh-cot-gw-static/tool-gate
  config:
    # STATIC resident surface: these exact tools stay in every request's
    # tool catalog. Fixed schemas keep the request prefix byte-stable, so
    # the LLM provider's prefix cache keeps hitting. All other registered
    # tools are reached through `gateway` (list/call) — same policy
    # pipeline, no bypass. Add a tool here to pin it permanently.
    # Windows adaptation: bash renamed to pwsh (bash is unavailable on Win32).
    resident: ["pwsh","str_replace_editor","gateway","skill_search","skill_load","vision_tile_recognize","subagent","send_message","list_agents","interrupt_agent","exit_plan_mode","read_image","present","run_code"]


- id: tool-watch
  name: dsh-cot-gw-static/tool-watch

- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: both

- id: present
  name: '@deepseek-ai/dsh-tool-present'
